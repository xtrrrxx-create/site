<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Jarvis Finder — Admin</title>
    <style>
        :root { --bg:#121212; --card:#1e1e1e; --border:#2a2a2a; --txt:#f0f0f0; --sub:#a1a1aa; --accent:#ff9f0a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter Tight', system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--txt); min-height: 100vh; padding: 2rem 1rem; }
        .wrap { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; }
        .sub { color: var(--sub); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .gate { max-width: 360px; margin: 4rem auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; }
        .gate h2 { font-size: 1.1rem; margin-bottom: 1rem; }
        input, button { font-size: 0.95rem; }
        input { width: 100%; padding: 0.7rem 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--txt); margin-bottom: 0.8rem; }
        button { padding: 0.7rem 1.1rem; background: var(--accent); color: #111; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        button.ghost { background: transparent; color: var(--sub); border: 1px solid var(--border); }
        .err { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.2em; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem 1.3rem; }
        .stat .label { color: var(--sub); font-size: 0.82rem; margin-bottom: 0.4rem; }
        .stat .value { font-size: 2rem; font-weight: 700; }
        .stat .value.live { color: #34d399; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.3rem; }
        .panel h2 { font-size: 1.05rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--sub); font-weight: 500; }
        td.num { text-align: right; font-weight: 600; color: var(--accent); }
        .rank { color: var(--sub); width: 2rem; }
        .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
        .muted { color: var(--sub); font-size: 0.8rem; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="wrap">
        <div id="gate" class="gate">
            <h2>Admin access</h2>
            <input type="password" id="token" placeholder="Enter admin token" autocomplete="off" />
            <button id="login">Open dashboard</button>
            <div class="err" id="gate-err"></div>
        </div>

        <div id="dash" class="hidden">
            <div class="topbar">
                <div>
                    <h1>Jarvis Finder — Analytics</h1>
                    <div class="sub" id="updated"></div>
                </div>
                <div>
                    <button class="ghost" id="refresh">Refresh</button>
                    <button class="ghost" id="logout">Log out</button>
                </div>
            </div>

            <div class="cards">
                <div class="stat"><div class="label">Total visits</div><div class="value" id="m-total">–</div></div>
                <div class="stat"><div class="label">Unique visitors</div><div class="value" id="m-unique">–</div></div>
                <div class="stat"><div class="label">Visits today</div><div class="value" id="m-today">–</div></div>
                <div class="stat"><div class="label">Online now</div><div class="value live" id="m-online">–</div></div>
            </div>

            <div class="panel">
                <h2>Most clicked items</h2>
                <table>
                    <thead><tr><th class="rank">#</th><th>Product</th><th style="text-align:right">Clicks</th></tr></thead>
                    <tbody id="top-body"></tbody>
                </table>
                <div class="muted" id="top-empty" style="margin-top:0.8rem;"></div>
            </div>
        </div>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>
