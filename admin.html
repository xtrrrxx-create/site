<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jarvis Finder</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f;
    --surface: #18181b;
    --border: #2a2a2e;
    --accent: #4ade80;
    --danger: #f87171;
    --text: #f4f4f5;
    --muted: #71717a;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* LOGIN */
  #login-screen {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 2.5rem; width: 100%; max-width: 380px;
  }
  .login-box h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .login-box p { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.8rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; }
  .field input {
    width: 100%; padding: 0.7rem 1rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.95rem; outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%; padding: 0.75rem; background: var(--accent); color: #000;
    border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.85; }
  #login-error { color: var(--danger); font-size: 0.82rem; margin-top: 0.8rem; text-align: center; }

  /* ADMIN */
  #admin-screen { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .topbar h1 { font-size: 1rem; font-weight: 700; }
  .topbar span { color: var(--muted); font-size: 0.8rem; }
  .btn-logout {
    padding: 0.4rem 1rem; background: transparent; border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer; font-size: 0.8rem;
    transition: border-color 0.2s;
  }
  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  .admin-body { padding: 2rem; max-width: 1400px; margin: 0 auto; }

  /* STATS */
  .stats { display: flex; gap: 1rem; margin-bottom: 2rem; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.5rem; flex: 1;
  }
  .stat-card .num { font-size: 2rem; font-weight: 800; color: var(--accent); }
  .stat-card .lbl { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }

  /* ADD FORM */
  .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 1rem; }
  .add-form {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 1.5rem; margin-bottom: 2rem;
  }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }
  .form-grid input, .form-grid select {
    width: 100%; padding: 0.6rem 0.9rem; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.85rem; outline: none;
    transition: border-color 0.2s;
  }
  .form-grid input:focus, .form-grid select:focus { border-color: var(--accent); }
  .form-grid input::placeholder { color: var(--muted); }
  .btn-add {
    padding: 0.6rem 1.4rem; background: var(--accent); color: #000;
    border: none; border-radius: 8px; font-weight: 700; cursor: pointer;
    font-size: 0.85rem; transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }
  #add-msg { font-size: 0.8rem; margin-left: 0.8rem; }

  /* TABLE */
  .table-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem;
  }
  .search-bar {
    padding: 0.55rem 1rem; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.85rem; outline: none; width: 280px;
  }
  .search-bar:focus { border-color: var(--accent); }
  .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  thead { background: var(--surface); }
  th { padding: 0.8rem 1rem; text-align: left; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--border); }
  td { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .td-img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
  .td-title { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px;
    font-size: 0.7rem; font-weight: 700;
  }
  .badge-best { background: #1f5130; color: #b8f7cc; }
  .badge-budget { background: #51411f; color: #ffe3ab; }
  .badge-random { background: #2a2f42; color: #c7d2ff; }
  .badge-other { background: #2c2d34; color: #d9d9df; }
  .btn-del {
    padding: 0.3rem 0.7rem; background: transparent; border: 1px solid var(--border);
    color: var(--danger); border-radius: 6px; cursor: pointer; font-size: 0.75rem;
    transition: background 0.2s;
  }
  .btn-del:hover { background: rgba(248,113,113,0.1); }
  .pagination { display: flex; gap: 0.5rem; margin-top: 1.2rem; align-items: center; }
  .btn-page {
    padding: 0.4rem 0.9rem; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; cursor: pointer; font-size: 0.8rem;
  }
  .btn-page:disabled { opacity: 0.3; cursor: default; }
  .btn-page.active { border-color: var(--accent); color: var(--accent); }
  #page-info { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>🔐 Admin Panel</h1>
    <p>Jarvis Finder — acces restricționat</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="email@example.com">
    </div>
    <div class="field">
      <label>Parolă</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn-login" onclick="login()">Intră</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin-screen">
  <div class="topbar">
    <div>
      <h1>Jarvis Finder — Admin</h1>
      <span id="user-email"></span>
    </div>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>

  <div class="admin-body">
    <!-- Stats -->
    <div class="stats">
      <div class="stat-card"><div class="num" id="stat-total">—</div><div class="lbl">Total produse</div></div>
      <div class="stat-card"><div class="num" id="stat-shoes">—</div><div class="lbl">Shoes</div></div>
      <div class="stat-card"><div class="num" id="stat-clothing">—</div><div class="lbl">Clothing</div></div>
      <div class="stat-card"><div class="num" id="stat-other">—</div><div class="lbl">Altele</div></div>
    </div>

    <!-- Add product -->
    <div class="section-title">Adaugă produs nou</div>
    <div class="add-form">
      <div class="form-grid">
        <input id="f-title" placeholder="Titlu *">
        <input id="f-price" placeholder="Preț (CNY) *">
        <input id="f-img" placeholder="URL imagine">
        <input id="f-kakobuy" placeholder="Link Kakobuy">
        <input id="f-picksly" placeholder="Link Picksly">
        <select id="f-category">
          <option value="">Categorie</option>
          <option>Shoes</option>
          <option>Clothing</option>
          <option>Accessories</option>
          <option>Bags</option>
          <option>Electronics</option>
          <option>Other</option>
        </select>
        <select id="f-batch">
          <option value="">Batch</option>
          <option>Best Batch</option>
          <option>Budget Batch</option>
          <option>Random Batch</option>
        </select>
      </div>
      <button class="btn-add" onclick="addProduct()">+ Adaugă</button>
      <span id="add-msg"></span>
    </div>

    <!-- Table -->
    <div class="table-header">
      <div class="section-title" style="margin:0">Produse (<span id="filtered-count">0</span>)</div>
      <input class="search-bar" id="search" placeholder="Caută după titlu..." oninput="applySearch()">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Img</th>
            <th>Titlu</th>
            <th>Preț</th>
            <th>Categorie</th>
            <th>Batch</th>
            <th>Kakobuy</th>
            <th>Acțiuni</th>
          </tr>
        </thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>
    <div class="pagination">
      <button class="btn-page" id="btn-prev" onclick="changePage(-1)">← Prev</button>
      <span id="page-info"></span>
      <button class="btn-page" id="btn-next" onclick="changePage(1)">Next →</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://jcfcyqnuhufmtoxlqknt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1u-Oyiiswh68aD5aa80I1g_iJoLjc1T';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allProducts = [];
let filtered = [];
let page = 1;
const PER_PAGE = 50;

// AUTH
async function login() {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if (error) {
    document.getElementById('login-error').textContent = 'Email sau parolă greșită.';
  } else {
    showAdmin();
  }
}

async function logout() {
  await sb.auth.signOut();
  location.reload();
}

async function showAdmin() {
  const { data: { user } } = await sb.auth.getUser();
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('user-email').textContent = user.email;
  await loadProducts();
}

// PRODUCTS
async function loadProducts() {
  const { data, error } = await sb.from('products').select('*').order('id', { ascending: false });
  if (error) { alert('Eroare la încărcare: ' + error.message); return; }
  allProducts = data;
  filtered = [...allProducts];
  updateStats();
  renderTable();
}

function updateStats() {
  document.getElementById('stat-total').textContent = allProducts.length;
  document.getElementById('stat-shoes').textContent = allProducts.filter(p => p.category === 'Shoes').length;
  document.getElementById('stat-clothing').textContent = allProducts.filter(p => p.category === 'Clothing').length;
  document.getElementById('stat-other').textContent = allProducts.filter(p => !['Shoes','Clothing'].includes(p.category)).length;
}

function applySearch() {
  const q = document.getElementById('search').value.toLowerCase();
  filtered = allProducts.filter(p => p.title.toLowerCase().includes(q));
  page = 1;
  renderTable();
}

function renderTable() {
  const start = (page - 1) * PER_PAGE;
  const slice = filtered.slice(start, start + PER_PAGE);
  document.getElementById('filtered-count').textContent = filtered.length;
  document.getElementById('page-info').textContent = `Pagina ${page} / ${Math.ceil(filtered.length / PER_PAGE) || 1}`;
  document.getElementById('btn-prev').disabled = page === 1;
  document.getElementById('btn-next').disabled = start + PER_PAGE >= filtered.length;

  const tbody = document.getElementById('products-tbody');
  tbody.innerHTML = slice.map(p => {
    const batch = (p.batch || '').toLowerCase();
    const badgeClass = batch.includes('best') ? 'badge-best' : batch.includes('budget') ? 'badge-budget' : batch.includes('random') ? 'badge-random' : 'badge-other';
    return `<tr>
      <td>${p.img ? `<img class="td-img" src="${p.img}" onerror="this.style.display='none'">` : '—'}</td>
      <td><span class="td-title" title="${p.title}">${p.title}</span></td>
      <td>¥${p.price || '—'}</td>
      <td>${p.category || '—'}</td>
      <td><span class="badge ${badgeClass}">${p.batch || '—'}</span></td>
      <td>${p.kakobuy ? `<a href="${p.kakobuy}" target="_blank" style="color:#4ade80;font-size:0.75rem;">Link</a>` : '—'}</td>
      <td><button class="btn-del" onclick="deleteProduct(${p.id}, '${p.title.replace(/'/g,"\\'")}')">Șterge</button></td>
    </tr>`;
  }).join('');
}

function changePage(dir) {
  page += dir;
  renderTable();
  window.scrollTo(0, 0);
}

async function addProduct() {
  const title = document.getElementById('f-title').value.trim();
  const price = document.getElementById('f-price').value.trim();
  if (!title || !price) { showMsg('Titlu și preț sunt obligatorii!', 'var(--danger)'); return; }

  const product = {
    title,
    price,
    img: document.getElementById('f-img').value.trim() || null,
    kakobuy: document.getElementById('f-kakobuy').value.trim() || null,
    picksly: document.getElementById('f-picksly').value.trim() || null,
    category: document.getElementById('f-category').value || null,
    batch: document.getElementById('f-batch').value || null,
  };

  const { error } = await sb.from('products').insert([product]);
  if (error) { showMsg('Eroare: ' + error.message, 'var(--danger)'); return; }

  showMsg('✓ Produs adăugat!', 'var(--accent)');
  ['f-title','f-img','f-price','f-kakobuy','f-picksly'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-category').value = '';
  document.getElementById('f-batch').value = '';
  await loadProducts();
}

async function deleteProduct(id, title) {
  if (!confirm(`Ștergi "${title}"?`)) return;
  const { error } = await sb.from('products').delete().eq('id', id);
  if (error) { alert('Eroare: ' + error.message); return; }
  await loadProducts();
}

function showMsg(msg, color) {
  const el = document.getElementById('add-msg');
  el.textContent = msg;
  el.style.color = color;
  setTimeout(() => el.textContent = '', 3000);
}

// Check session on load
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) showAdmin();
});
</script>
</body>
</html>
