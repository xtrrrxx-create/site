            </div>
            <div class="cmd-results" id="cmd-results"></div>
        </div>
    </div>

    <main id="app-content">
        <!-- Content will be dynamically loaded here by app.js -->

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card" style="border-radius: 24px; padding: 2rem;">
            <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">

                <button class="btn-icon"
                    style="background: var(--border-color); border: none; color: var(--text-secondary);"
                    data-action="closeSettings">

                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" style="margin-top: 2rem;">
                <label
                    style="display: block; margin-bottom: 1rem; color: #888; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase;">Language
                    / Currency</label>
                <div class="currency-container" id="currency-container">
                    <div class="cur-card active" data-cur="USD" data-action="changeCurrency" data-arg="USD">
                        <span class="cur-flag">🇺🇸</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">$ USD</span>
                            <span class="cur-sub">English</span>

                    <div class="cur-card" data-cur="PLN" data-action="changeCurrency" data-arg="PLN">

                            <span class="cur-sub">Polski</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="CNY" data-action="changeCurrency" data-arg="CNY">
                        <span class="cur-flag">🇨🇳</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">¥ CNY</span>
                            <span class="cur-sub">中文</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="EUR" data-action="changeCurrency" data-arg="EUR">
                        <span class="cur-flag">🇪🇺</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">€ EUR</span>
                            <span class="cur-sub">English</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="RON" data-action="changeCurrency" data-arg="RON">
                        <span class="cur-flag">🇷🇴</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">lei RON</span>
                            <span class="cur-sub">Română</span>
                        </div>
                    </div>
