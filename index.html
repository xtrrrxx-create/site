<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer" />
    <title>jarvis finder</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="cursor-glow" class="cursor-glow"></div>
    <div class="nav-container">
        <nav class="navbar">
            <div class="logo" onclick="document.querySelector('[data-page=home]').click();">jarvis finder</div>

            <div class="nav-center">
                <ul class="nav-links">
                    <li><a href="#" data-page="home" class="active">Home</a></li>
                    <li><a href="#" data-page="products">Products</a></li>
                    <li><a href="#" data-page="tutorials">Tutorials</a></li>
                    <li><a href="#" data-page="tools">Tools <span
                                style="font-size: 0.7em; vertical-align: middle; margin-left: 2px;">▼</span></a></li>
                </ul>
            </div>

            <div class="nav-actions">
                <button class="btn-icon" aria-label="Toggle Theme" id="theme-btn" onclick="toggleTheme()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <button class="btn-icon" aria-label="Settings" id="settings-btn" style="margin-left: 0.5rem;"
                    onclick="document.getElementById('settings-modal').style.display='flex'">
                    <svg class="gear-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>
        </nav>
    </div>

    <main id="app-content">
        <!-- Content will be dynamically loaded here by app.js -->
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-card" style="border-radius: 24px; padding: 2rem;">
            <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
                <h2 style="font-size: 1.6rem; font-weight: 900;">Settings</h2>
                <button class="btn-icon"
                    style="background: var(--border-color); border: none; color: var(--text-secondary);"
                    onclick="document.getElementById('settings-modal').style.display='none'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" style="margin-top: 2rem;">
                <label
                    style="display: block; margin-bottom: 1rem; color: #888; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.5px; text-transform: uppercase;">Language
                    / Currency</label>
                <div class="currency-container" id="currency-container">
                    <div class="cur-card active" data-cur="USD" onclick="changeCurrencyUI('USD')">
                        <span class="cur-flag">🇺🇸</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">$ USD</span>
                            <span class="cur-sub">English</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="PLN" onclick="changeCurrencyUI('PLN')">
                        <span class="cur-flag">🇵🇱</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">zł PLN</span>
                            <span class="cur-sub">Polski</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="CNY" onclick="changeCurrencyUI('CNY')">
                        <span class="cur-flag">🇨🇳</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">¥ CNY</span>
                            <span class="cur-sub">中文</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="EUR" onclick="changeCurrencyUI('EUR')">
                        <span class="cur-flag">🇪🇺</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">€ EUR</span>
                            <span class="cur-sub">English</span>
                        </div>
                    </div>
                    <div class="cur-card" data-cur="RON" onclick="changeCurrencyUI('RON')">
                        <span class="cur-flag">🇷🇴</span>
                        <div class="cur-divider"></div>
                        <div class="cur-text">
                            <span class="cur-title">lei RON</span>
                            <span class="cur-sub">Română</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
