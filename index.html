<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jarvis Finder</title>
<link rel="icon" href="/images/coldmode-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="/coldmode-config.js"></script>
<style>
  /* Conținutul e ascuns până e gata, dar arătăm un loader (nu ecran alb gol). */
  body > :not(#cm-loader) { opacity: 0; }
  html.ready body > :not(#cm-loader) { opacity: 1; transition: opacity .25s ease; }
  #cm-loader { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg-color, #F2F2F2); transition: opacity .35s ease; }
  html.ready #cm-loader { opacity: 0; pointer-events: none; }
  #cm-loader .cm-spinner { width: 46px; height: 46px; border-radius: 50%; border: 4px solid rgba(2,72,115,0.15); border-top-color: var(--border-color, #024873); animation: cmspin .8s linear infinite; }
  #cm-loader .cm-loading-text { font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.95rem; font-weight: 600; letter-spacing: 0.02em; color: var(--border-color, #024873); }
  @keyframes cmspin { to { transform: rotate(360deg); } }
</style>
<script>
  // Arăt pagina doar după ce fontul ȘI conținutul (Firestore) sunt gata → fără salt.
  (function () {
    let fontsOk = false, contentOk = false;
    window.__reveal = () => { if (fontsOk && contentOk) document.documentElement.classList.add('ready'); };
    window.cmContentReady = () => {
      contentOk = true; window.__reveal();
      // Restaurez poziția scroll salvată (doar pe aceeași pagină), după ce s-a randat.
      try {
        const y = sessionStorage.getItem('cm-scroll');
        const p = sessionStorage.getItem('cm-path');
        if (y && p === location.pathname) {
          requestAnimationFrame(() => requestAnimationFrame(() => window.scrollTo(0, parseInt(y, 10))));
        }
      } catch (_) {}
    };
    // Salvez poziția scroll înainte de refresh/închidere.
    window.addEventListener('beforeunload', () => {
      try {
        sessionStorage.setItem('cm-scroll', window.scrollY);
        sessionStorage.setItem('cm-path', location.pathname);
      } catch (_) {}
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fontsOk = true; window.__reveal(); });
    else fontsOk = true;
    // Fallback: arăt oricum după 2.5s dacă ceva întârzie.
    setTimeout(() => { fontsOk = true; contentOk = true; window.__reveal(); }, 2500);
  })();
  // Palete de accent — fiecare schimbă toată schema (carduri, texte, butoane).
  const PALETTES = {
    blue:   { bg:'#F2F2F2', surface:'#6085A6', muted:'#A0B9D9', border:'#024873', accent:'#D0DCF2', hover:'#8aa9cf', card:'#cdddec' },
    indigo: { bg:'#F1F3F8', surface:'#5b78c2', muted:'#aab8e0', border:'#1e3a8a', accent:'#5b8cf7', hover:'#7e96d6', card:'#d4ddf4' },
    cyan:   { bg:'#F0F5F8', surface:'#3f86a8', muted:'#a8c8d9', border:'#0b3a4a', accent:'#2bbfe0', hover:'#7fa9c0', card:'#cce5ef' },
    teal:   { bg:'#F0F6F5', surface:'#3f8f87', muted:'#a8d0cb', border:'#0b4a44', accent:'#2bd4c0', hover:'#7fb3ad', card:'#cce8e3' },
    green:  { bg:'#F1F5F2', surface:'#4f9170', muted:'#a9cfb9', border:'#0b4a2f', accent:'#2bd47a', hover:'#7fb393', card:'#cee8d8' },
    lime:   { bg:'#F4F6EF', surface:'#7a9b3f', muted:'#c7d9a0', border:'#3a4a0b', accent:'#9fd42b', hover:'#a3b97f', card:'#e0ecc6' },
    amber:  { bg:'#F8F6F0', surface:'#c2a23e', muted:'#e8dba0', border:'#5e4a0e', accent:'#f5c531', hover:'#d4c163', card:'#f3ead0' },
    orange: { bg:'#F8F4F0', surface:'#c07a3e', muted:'#e8c39a', border:'#6b3a10', accent:'#ff9f1a', hover:'#d49a63', card:'#f3e0cb' },
    red:    { bg:'#F8F2F1', surface:'#a85f5f', muted:'#d9b0b0', border:'#6b1e1e', accent:'#f56b6b', hover:'#c08282', card:'#f3d6d6' },
    pink:   { bg:'#F8F1F5', surface:'#aa5e8c', muted:'#d9b0c8', border:'#6b1e4a', accent:'#f56fb0', hover:'#c082a0', card:'#f3d6e6' },
    purple: { bg:'#F4F1F8', surface:'#7e5fae', muted:'#c2b0d9', border:'#3b1e6b', accent:'#b06bff', hover:'#9a82c0', card:'#e3d6f3' },
    mono:   { bg:'#F4F4F5', surface:'#6b7280', muted:'#c4c8cf', border:'#1f2937', accent:'#d4d8df', hover:'#9aa0aa', card:'#e4e6ea' },
  };
  window.PALETTES = PALETTES;
  function applyPalette(key) {
    const p = PALETTES[key] || PALETTES.blue;
    const r = document.documentElement.style;
    r.setProperty('--bg-color', p.bg);
    r.setProperty('--surface', p.surface);
    r.setProperty('--nav-bg', p.surface);
    r.setProperty('--muted', p.muted);
    r.setProperty('--border-color', p.border);
    r.setProperty('--accent-color', p.accent);
    r.setProperty('--muted-hover', p.hover);
    r.setProperty('--card-bg', p.card);
  }
  window.applyPalette = applyPalette;
  try { applyPalette(localStorage.getItem('preferredAccent') || 'mono'); } catch (e) {}
</script>
<style>
  /* ── Paleta ta, mapată peste design tokens reale ── */
  :root {
    --bg-color: #F2F2F2;
    --nav-bg: #6085A6;
    --border-color: #024873;
    --text-primary: #F2F2F2;
    --text-secondary: #F2F2F2;
    --accent-color: #D0DCF2;
    --surface: #6085A6;     /* card seller */
    --muted: #A0B9D9;
    --muted-hover: #8aa9cf;
  }
  * { box-sizing: border-box; }
  ::selection { background: var(--surface); color: #F2F2F2; }
  ::-moz-selection { background: var(--surface); color: #F2F2F2; }
  body {
    margin: 0;
    background: var(--bg-color);
    color: var(--text-primary);
    font-family: 'Inter Tight', system-ui, -apple-system, sans-serif;
    padding-bottom: 4rem;
  }

  /* ── EXACT din storesCss (app.js) ── */
  .hc-carousel-wrap { position: relative; }
  .hc-carousel { display: flex; gap: 16px; padding: 24px 0; margin: -24px 0; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; cursor: grab; }
  .hc-carousel:active { cursor: grabbing; }
  .hc-carousel::-webkit-scrollbar { display: none; }
  .hc-card { flex-shrink: 0; width: 243.2px; display: flex; flex-direction: column; content-visibility: auto; contain-intrinsic-size: 243px 360px; }
  .hc-card .product-image { height: auto; aspect-ratio: 1; }
  .hc-arrow { position: absolute; top: 45%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); border: 1px solid var(--border-color); color: var(--text-primary); display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 5; transition: background 0.15s; backdrop-filter: blur(4px); }
  .hc-carousel-wrap:hover .hc-arrow { display: flex; }
  .hc-arrow:hover { opacity: 0.9; }
  .hc-arrow-left { left: 8px; } .hc-arrow-right { right: 8px; }
  .stores-page-head { max-width: 1280px; margin: 0.5rem auto 1rem; padding: 0; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .stores-page-head h1 { font-family: 'Inter Tight', system-ui, sans-serif; font-size: 32px; font-weight: 700; color: var(--border-color); margin: 0; }
  /* Filtru categorie (dropdown lângă titlu, în stilul meniului de setări) */
  .cat-filter { position: relative; flex-shrink: 0; }
  .cat-filter-btn { display: flex; align-items: center; gap: 8px; background: var(--surface); color: #F2F2F2; border: none; border-radius: 9999px; height: 40px; padding: 0 16px; font-family: 'Inter Tight', system-ui, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 2px 6px -2px var(--border-color); transition: opacity .15s ease; }
  .cat-filter-btn:hover { opacity: .9; }
  .cat-filter-btn .cf-chev { transition: transform .2s ease; }
  .cat-filter.open .cf-chev { transform: rotate(180deg); }
  .cat-filter-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 200; min-width: 210px; padding: 6px; background: var(--surface); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 16px 40px -8px var(--border-color); }
  .cat-filter-menu[hidden] { display: none; }
  .cat-filter-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border: none; background: transparent; border-radius: 9px; font-family: inherit; font-size: 14px; font-weight: 600; color: #F2F2F2; cursor: pointer; }
  .cat-filter-item:hover, .cat-filter-item.active { background: var(--muted-hover); }
  .cat-filter-item .cf-check { opacity: 0; flex-shrink: 0; }
  .cat-filter-item.active .cf-check { opacity: 1; }
  .store-section-card { max-width: 1280px; margin: 0 auto 1.5rem; background: var(--card-bg, var(--surface)); border: none; border-radius: 16px; padding: 0; overflow: hidden; box-shadow: 0 6px 18px -4px var(--border-color); }
  .store-page-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0; }
  .store-section-card .store-icon { width: 48px; height: 48px; font-size: 1.2rem; border: 3px solid var(--bg-color); }
  .store-section-divider { height: 1px; background: rgba(2,72,115,.35); margin: 16px 20px 0; }
  .store-section-card .hc-carousel { padding: 16px 20px 14px; margin: 0; }
  .store-section-card .hc-arrow-left { left: 8px; }
  .store-section-card .hc-arrow-right { right: 8px; }
  .store-view-btn-sm { width: auto; margin-top: 0; padding: 0 1.4rem; height: 36px; }

  /* ── HERO (Home) ── */
  .pl-hero { text-align: center; padding: 2.25rem 24px 1.25rem; max-width: 1280px; margin: 0 auto; }
  .pl-hero-title { font-family: 'Inter Tight', system-ui, sans-serif; font-size: clamp(32px, 5vw, 42px); font-weight: 600; letter-spacing: -0.025em; line-height: 1.5; color: var(--border-color); margin: 0 0 0.5rem; }
  .pl-accent { font-weight: 800; color: var(--surface); }
  .pl-hero-sub { font-family: 'Inter Tight', system-ui, sans-serif; color: var(--border-color); opacity: 0.85; font-size: clamp(14px, 1.5vw, 16px); margin: 0 0 1.75rem; }
  .pl-hero .pl-search-wrap { max-width: 541px; height: auto; padding: 18px 20px; margin: 0 auto; }
  .search-host { position: relative; max-width: 541px; margin: 0 auto 1.5rem; }
  .search-panel { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 60; text-align: left; background: var(--card-bg, #fff); border: 1px solid var(--border-color); border-radius: 18px; padding: 1rem 1.1rem; box-shadow: 0 16px 50px #02487340; max-height: 70vh; overflow-y: auto; }
  .sp-section { margin-bottom: 1rem; } .sp-section:last-child { margin-bottom: 0; }
  .sp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; font-size: 0.95rem; font-weight: 700; color: var(--border-color); }
  .sp-clear { background: none; border: none; color: var(--border-color); opacity: .7; font-size: 0.8rem; cursor: pointer; font-weight: 600; font-family: inherit; }
  .sp-clear:hover { opacity: 1; }
  .sp-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .sp-chip { display: inline-flex; align-items: center; gap: 6px; padding: 0.45rem 0.85rem; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 9999px; color: var(--border-color); font-size: 0.85rem; font-weight: 600; font-family: inherit; cursor: pointer; transition: background 0.15s; }
  .sp-chip:hover { background: var(--muted); }
  .sp-chip svg { width: 13px; height: 13px; opacity: .7; flex-shrink: 0; }
  .sp-thumbs { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; }
  .sp-thumbs::-webkit-scrollbar { display: none; }
  .sp-thumb { flex: 0 0 auto; width: 72px; height: 72px; border-radius: 10px; overflow: hidden; background: var(--muted); cursor: pointer; border: 1px solid var(--border-color); }
  .sp-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .sp-empty { font-size: .82rem; color: var(--border-color); opacity: .6; }
  .pl-hero .pl-search-input { font-size: 0.95rem; }
  .pl-hero .pl-search-icon, .pl-hero .pl-search-paste svg { width: 18px; height: 18px; }
  .pl-explore-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-color); color: var(--border-color); border: 1px solid var(--border-color); border-radius: 9999px; padding: 12px 26px; font-family: 'Inter Tight', system-ui, sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; box-shadow: 0 4px 12px -4px var(--border-color); transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .pl-explore-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -5px var(--border-color); }

  /* ── NAVBAR (exact din site, în albastru, fără Stores/Products) ── */
  .nav-container { width: 100%; position: sticky; top: 0; z-index: 100; background: var(--bg-color); backdrop-filter: blur(4px); border: none; }
  .navbar { height: 77px; padding: 0 4%; background: transparent; border: none; box-shadow: none; width: 100%; box-sizing: border-box; }
  .navbar-inner { display: flex; align-items: center; justify-content: space-between; position: relative; height: 77px; gap: 1.5rem; max-width: 1280px; margin: 0 auto; width: 100%; }
  .nav-left { display: flex; align-items: center; gap: 1.5rem; flex: 1 1 0; min-width: 0; }
  .nav-burger { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; margin-left: -8px; background: transparent; border: none; color: var(--border-color); border-radius: 10px; flex: 0 0 auto; }
  .nav-logo { display: inline-flex; align-items: center; flex-shrink: 0; }
  .nav-logo img { height: 40px; width: auto; display: block; }
  .nav-link { font-family: 'Inter Tight', system-ui, sans-serif; font-size: 0.9rem; color: var(--border-color); text-decoration: none; font-weight: 500; padding: 4px 8px; border-radius: 6px; transition: color 0.15s ease, background 0.15s ease; }
  .nav-link:hover, .nav-link.active { color: var(--border-color); background: transparent; }
  .nav-center { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .navbar .nav-search-wrap { position: relative; flex: 0 1 520px; width: 520px; max-width: 100%; height: 48px; margin: 0 auto; opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease; }
  .navbar .nav-search-wrap.show { opacity: 1; visibility: visible; }
  .pl-search-wrap { position: relative; display: flex; align-items: center; gap: 0.2rem; background: var(--surface); border: none; border-radius: 9999px; padding: 0 20px; height: 48px; box-shadow: 0 2px 4px #02487322, 0 8px 16px #02487333; transition: box-shadow 0.15s; }
  /* La focus: întunecă PUȚIN culoarea curentă (orice temă), nu o culoare fixă.
     Overlay-ul inset stă peste fundal dar sub text, deci textul rămâne lizibil. */
  .pl-search-wrap:focus-within, .pl-search-wrap.searching { box-shadow: 0 2px 4px #02487322, 0 8px 16px #02487333, inset 0 0 0 999px rgba(0,0,0,0.12); }
  .pl-search-wrap::before { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 1px solid var(--border-color); border-bottom: 0; pointer-events: none; }
  .pl-search-icon { color: var(--text-primary); flex-shrink: 0; }
  .pl-search-input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-size: 0.95rem; padding: 0 0.75rem; font-family: 'Inter Tight', system-ui, sans-serif; }
  .pl-search-input::placeholder { color: var(--text-primary); opacity: 0.8; }
  .pl-search-paste { background: transparent; border: none; color: var(--text-primary); cursor: pointer; padding: 0.25rem; display: flex; align-items: center; transition: opacity 0.2s; }
  .pl-search-paste:hover { opacity: 0.7; }
  .nav-right { display: flex; align-items: center; justify-content: flex-end; gap: 1.4rem; flex: 1 1 0; min-width: 0; }
  .nav-more-wrap { position: relative; }
  .nav-more-btn { display: flex; align-items: center; gap: 4px; cursor: pointer; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 14px; font-weight: 600; color: var(--border-color); background: transparent; border: none; white-space: nowrap; padding: 4px 8px; border-radius: 6px; transition: color 0.15s ease, background 0.15s ease; }
  .nav-more-wrap:hover .nav-more-btn, .nav-more-btn:hover { color: var(--text-primary); background: var(--muted-hover); }
  .nav-more-chev { transition: transform 0.2s ease; }
  .nav-more-wrap:hover .nav-more-chev { transform: rotate(180deg); }
  .nav-more-menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 1200; min-width: 176px; padding: 6px; background: var(--surface); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 16px 40px #02487355; transform-origin: top right; transition: opacity 0.25s, transform 0.25s; opacity: 0; transform: scale(0.97) translateY(-6px); pointer-events: none; }
  .nav-more-menu::before { content: ''; position: absolute; left: 0; right: 0; top: -10px; height: 10px; }
  .nav-more-wrap:hover .nav-more-menu { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
  .nav-more-item { display: block; padding: 9px 12px; border-radius: 8px; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 14px; color: var(--text-primary); text-decoration: none; white-space: nowrap; transition: background 0.15s ease; }
  .nav-more-item:hover { background: var(--muted-hover); }
  .nav-gear-btn { width: 36px; height: 36px; border: none; flex-shrink: 0; background: transparent; color: var(--border-color); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.15s ease, color 0.15s ease; }
  .nav-gear-btn:hover { background: var(--muted-hover); color: var(--text-primary); }
  .nav-gear-btn .gear-icon { transition: transform 0.4s ease; }
  .nav-gear-btn:hover .gear-icon { transform: rotate(90deg); }
  /* Meniu burger (mobil) — Home / Sellers, în stilul dropdown-ului de setări. */
  .nav-burger-wrap { position: relative; display: none; }
  .nav-burger-menu { position: absolute; left: 0; top: calc(100% + 8px); z-index: 1200; min-width: 180px; padding: 6px; background: var(--surface); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 16px 40px #02487355; transform-origin: top left; opacity: 0; transform: scale(0.97) translateY(-6px); pointer-events: none; transition: opacity 0.18s cubic-bezier(0.16,1,0.3,1), transform 0.18s cubic-bezier(0.16,1,0.3,1); }
  .nav-burger-menu[hidden] { display: none; }
  .nav-burger-menu.open { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; }
  .nav-burger-item { display: block; padding: 10px 12px; border-radius: 9px; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #F2F2F2; text-decoration: none; transition: background 0.15s ease; }
  .nav-burger-item:hover, .nav-burger-item.active { background: var(--muted-hover); }
  /* ── Buton Report pe card ── */
  .card-report-btn { position: absolute; top: 8px; right: 8px; z-index: 3; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; border-radius: 8px; background: rgba(0,0,0,0.42); color: #fff; cursor: pointer; opacity: 0; transition: opacity .15s ease, background .15s ease; }
  .product-card:hover .card-report-btn, .card-report-btn:focus-visible { opacity: 1; }
  .card-report-btn:hover { background: rgba(0,0,0,0.68); }
  @media (hover: none) { .card-report-btn { opacity: 0.85; } }
  /* ── Modal Report ── */
  .rp-overlay { position: fixed; inset: 0; z-index: 3000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,0.55); backdrop-filter: blur(2px); }
  .rp-overlay.open { display: flex; }
  .rp-modal { width: min(420px, 94vw); max-height: 88vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--border-color); border-radius: 16px; box-shadow: 0 24px 60px #02487355; animation: apSlideUp .22s ease; }
  .rp-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--border-color); }
  .rp-head h3 { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 1rem; font-weight: 700; color: #F2F2F2; }
  .rp-close { background: transparent; border: none; color: var(--text-primary); cursor: pointer; padding: 4px; display: flex; border-radius: 8px; }
  .rp-close:hover { background: var(--muted-hover); }
  .rp-body { padding: 8px; }
  .rp-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 12px; border: none; background: transparent; border-radius: 10px; cursor: pointer; color: #F2F2F2; font-family: inherit; }
  .rp-opt:hover { background: var(--muted-hover); }
  .rp-radio { flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--text-secondary); position: relative; }
  .rp-opt.sel .rp-radio { border-color: var(--accent-color); }
  .rp-opt.sel .rp-radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--accent-color); }
  .rp-opt-label { font-size: 0.95rem; font-weight: 700; }
  .rp-note { margin: 4px 8px 8px; }

  <script>
    const aL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
    const aR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';

    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // ── Currency (prețuri stocate în CNY) ──
    // rate = unități din moneda respectivă pentru 1 ¥ CNY (aprox.)
    const CURRENCIES = [
      { code: 'CNY', label: '¥ CNY', symbol: '¥',  rate: 1,     dec: 0 },
      { code: 'USD', label: '$ USD', symbol: '$',  rate: 0.14,  dec: 2 },
      { code: 'EUR', label: '€ EUR', symbol: '€',  rate: 0.13,  dec: 2 },
      { code: 'GBP', label: '£ GBP', symbol: '£',  rate: 0.11,  dec: 2 },
      { code: 'RON', label: 'lei RON', symbol: 'lei', rate: 0.64, dec: 2 },
      { code: 'PLN', label: 'zł PLN', symbol: 'zł', rate: 0.51,  dec: 2 },
      { code: 'AUD', label: '$ AUD', symbol: 'A$', rate: 0.21,  dec: 2 },
      { code: 'CAD', label: '$ CAD', symbol: 'C$', rate: 0.19,  dec: 2 },
    ];
    const CUR_KEY = 'preferredCurrency';
    function currentCurrency() { return CURRENCIES.find(c => c.code === (localStorage.getItem(CUR_KEY) || 'CNY')) || CURRENCIES[0]; }
    function formatPrice(cny) {
      if (cny === null || cny === undefined || cny === '') return '';
      const c = currentCurrency();
      const v = Number(cny) * c.rate;
      const num = c.dec ? v.toFixed(c.dec) : Math.round(v);
      return c.code === 'CNY' ? `¥${num}` : (c.symbol === 'lei' || c.symbol === 'zł' ? `${num} ${c.symbol}` : `${c.symbol}${num}`);
    }

    // ════════════════════════════════════════════════════════════
    //  AGENT ROUTING (identic cu jarvis-finder — aceiași agenți + coduri aff)
    // ════════════════════════════════════════════════════════════
    const favicon = d => `https://www.google.com/s2/favicons?domain=${d}&sz=64`;
    const AGENTS = [
      { id: 'kakobuy',  name: 'Kakobuy',  icon: 'https://kakobuy.com/favicon.ico',      domain: 'kakobuy.com' },
      { id: 'oopbuy',   name: 'Oopbuy',   icon: 'https://www.oopbuy.com/favicon.ico',   domain: 'oopbuy.com' },
      { id: 'acbuy',    name: 'ACBuy',    icon: 'https://www.acbuy.com/favicon.ico',    domain: 'acbuy.com' },
      { id: 'mulebuy',  name: 'Mulebuy',  icon: 'https://www.mulebuy.com/favicon.ico',  domain: 'mulebuy.com' },
      { id: 'superbuy', name: 'Superbuy', icon: 'https://www.superbuy.com/favicon.ico', domain: 'superbuy.com' },
      { id: 'joyagoo',  name: 'Joyagoo',  icon: 'https://joyagoo.com/favicon.ico',      domain: 'joyagoo.com' },
      { id: 'usfans',   name: 'USFans',   icon: 'https://usfans.com/favicon.ico',       domain: 'usfans.com' },
    ];
    const PREFERRED_AGENT_KEY = 'preferredAgent';

    function safeExternalUrl(rawUrl) {
      const v = String(rawUrl || '').trim();
      if (!v) return '#';
      try { const u = new URL(v); return (u.protocol === 'http:' || u.protocol === 'https:') ? u.toString() : '#'; }
      catch { return '#'; }
    }
    function extractWeidianItemId(kakobuyUrl) {
      try {
        const p = new URL(kakobuyUrl);
        const nested = p.searchParams.get('url') || p.searchParams.get('link');
        if (!nested) return null;
        const s = new URL(decodeURIComponent(nested));
        return s.searchParams.get('itemID') || s.searchParams.get('itemId') || null;
      } catch { return null; }
    }
    function appendAffcodeIfMissing(rawUrl) {
      const clean = safeExternalUrl(rawUrl);
      if (clean === '#') return '#';
      try {
        const p = new URL(clean), host = p.hostname.toLowerCase();
        const m = h => host === h || host.endsWith('.' + h);
        if ((m('ikako.vip') || m('kakobuy.com')) && !p.searchParams.has('affcode')) p.searchParams.set('affcode', 'keviinn');
        return p.toString();
      } catch { return '#'; }
    }
    function buildAgentUrl(agentId, kakobuyRaw) {
      const clean = safeExternalUrl(kakobuyRaw || '#');
      if (clean === '#') return '#';
      if (agentId === 'kakobuy') return appendAffcodeIfMissing(clean);
      const itemId = extractWeidianItemId(clean);
      if (!itemId) return appendAffcodeIfMissing(clean);
      const enc = encodeURIComponent(`https://weidian.com/item.html?itemID=${itemId}`);
      switch (agentId) {
        case 'oopbuy':   return `https://oopbuy.com/product/2/${itemId}`;
        case 'acbuy':    return `https://www.acbuy.com/en/page/buy/?url=${enc}`;
        case 'mulebuy':  return `https://www.mulebuy.com/product/?url=${enc}`;
        case 'superbuy': return `https://www.superbuy.com/en/page/buy/?url=${enc}`;
        case 'joyagoo':  return `https://joyagoo.com/product?id=${itemId}&platform=WEIDIAN`;
        case 'usfans':   return `https://usfans.com/product?url=${enc}`;
        default:         return appendAffcodeIfMissing(clean);
      }
    }
    function parseSourcePlatform(pickslyRaw) {
      const m = String(pickslyRaw || '').match(/\/item\/(WD|TB|AL)(\d+)/i);
      if (!m) return null;
      const map = { WD: 'weidian', TB: 'taobao', AL: '1688' };
      const platform = map[m[1].toUpperCase()];
      return platform ? { platform, id: m[2] } : null;
    }
    function buildAgentUrlFromSource(agentId, platform, id) {
      if (!id || !platform) return null;
      const enc = {
        weidian: encodeURIComponent(`https://weidian.com/item.html?itemID=${id}`),
        taobao:  encodeURIComponent(`https://item.taobao.com/item.htm?id=${id}`),
        '1688':  encodeURIComponent(`https://detail.1688.com/offer/${id}.html`),
      };
      const T = {
        kakobuy:  { weidian:`https://www.kakobuy.com/item/details?url=${enc.weidian}&affcode=keviinn`, taobao:`https://www.kakobuy.com/item/details?url=${enc.taobao}&affcode=keviinn`, '1688':`https://www.kakobuy.com/item/details?url=${enc['1688']}&affcode=keviinn` },
        acbuy:    { weidian:`https://www.acbuy.com/product?id=${id}&source=WD&u=3R6HXS`, '1688':`https://www.acbuy.com/product?id=${id}&source=AL&u=3R6HXS`, taobao:`https://www.acbuy.com/product?id=${id}&source=TB&u=3R6HXS` },
        superbuy: { weidian:`https://www.superbuy.com/en/page/buy/?platform=WD&id=${id}&partnercode=kevnek`, '1688':`https://www.superbuy.com/en/page/buy/?platform=ALIBABA&id=${id}&partnercode=kevnek`, taobao:`https://www.superbuy.com/en/page/buy/?platform=TMALL&id=${id}&partnercode=kevnek` },
        usfans:   { weidian:`https://usfans.com/product/3/${id}?ref=SDXCQX`, '1688':`https://usfans.com/product/1/${id}?ref=SDXCQX`, taobao:`https://usfans.com/product/2/${id}?ref=SDXCQX` },
        oopbuy:   { weidian:`https://oopbuy.com/product/weidian/${id}?inviteCode=KVK77PNEM`, '1688':`https://oopbuy.com/product/0/${id}?inviteCode=KVK77PNEM`, taobao:`https://oopbuy.com/product/1/${id}?inviteCode=KVK77PNEM` },
        mulebuy:  { weidian:`https://mulebuy.com/product?id=${id}&platform=WEIDIAN&ref=200541300`, '1688':`https://mulebuy.com/product?id=${id}&platform=ALI_1688&ref=200541300`, taobao:`https://mulebuy.com/product?id=${id}&platform=TAOBAO&ref=200541300` },
        joyagoo:  { weidian:`https://joyagoo.com/product?id=${id}&platform=WEIDIAN&ref=301005780`, '1688':`https://joyagoo.com/product?id=${id}&platform=ALI_1688&ref=301005780`, taobao:`https://joyagoo.com/product?id=${id}&platform=TAOBAO&ref=301005780` },
      };
      return (T[agentId] && T[agentId][platform]) || null;
    }
    function withRef(rawUrl) {
      const clean = safeExternalUrl(rawUrl);
      if (clean === '#') return '#';
      if (/[?&]ref=keviinn\b/.test(clean)) return clean;
      return clean + (clean.includes('?') ? '&' : '?') + 'ref=keviinn';
    }
    // Parsează un link BRUT de marketplace (weidian / taobao / tmall / 1688)
    // → { platform, id }. Asta pun în admin la "Link Buy Now".
    function parseMarketplace(raw) {
      const s = String(raw || '').trim();
      if (!s) return null;
      let u; try { u = new URL(s); } catch { return null; }
      const host = u.hostname.toLowerCase();
      const q = u.searchParams;
      if (host.includes('weidian.com')) {
        const id = q.get('itemID') || q.get('itemId') || (u.pathname.match(/(\d{6,})/) || [])[1];
        if (id) return { platform: 'weidian', id };
      }
      if (host.includes('taobao.com') || host.includes('tmall.com')) {
        const id = q.get('id') || (u.pathname.match(/(\d{6,})/) || [])[1];
        if (id) return { platform: 'taobao', id };
      }
      if (host.includes('1688.com')) {
        const id = (u.pathname.match(/offer\/(\d+)/) || [])[1] || q.get('id') || (u.pathname.match(/(\d{6,})/) || [])[1];
        if (id) return { platform: '1688', id };
      }
      return null;
    }
    function resolveBuyUrl(pickslyRaw, kakobuyRaw, agentId) {
      agentId = (agentId || localStorage.getItem(PREFERRED_AGENT_KEY) || '').toLowerCase();
      if (!agentId) return null;
      // 1. link picks.ly (/item/WD…)  2. link brut weidian/taobao/1688  3. fallback
      const src = parseSourcePlatform(pickslyRaw) || parseMarketplace(pickslyRaw) || parseMarketplace(kakobuyRaw);
      if (src) { const u = buildAgentUrlFromSource(agentId, src.platform, src.id); if (u) return u; }
      return buildAgentUrl(agentId, kakobuyRaw);
    }
    // Deschide un URL de agent doar dacă e pe un domeniu permis (anti-abuz).
    function openAgentUrl(url) {
      if (!url || url === '#') return;
      try {
        const host = new URL(url).hostname.toLowerCase();
        const ok = AGENTS.some(a => host === a.domain || host.endsWith('.' + a.domain)) ||
                   host === 'ikako.vip' || host.endsWith('.ikako.vip');
        if (ok) window.open(url, '_blank', 'noopener,noreferrer');
      } catch {}
    }
    function showAgentPopup(pickslyRaw, kakobuyRaw) {
      const old = document.getElementById('agent-popup-overlay'); if (old) old.remove();
      const overlay = document.createElement('div');
      overlay.id = 'agent-popup-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,72,115,0.45);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);animation:apFadeIn .2s ease;';
      overlay.innerHTML = `
        <style>
          @keyframes apFadeIn { from{opacity:0;} to{opacity:1;} }
          @keyframes apSlideUp { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }
          .ap-modal { position:relative;background:var(--surface);border:1px solid var(--border-color);border-radius:16px;padding:1.5rem;width:380px;max-width:92vw;animation:apSlideUp .25s ease;box-shadow:0 18px 40px -8px var(--border-color); }
          .ap-title { font-family:'Inter Tight',system-ui,sans-serif;font-size:18px;font-weight:700;color:#F2F2F2;margin-bottom:0.25rem; }
          .ap-sub { font-size:13px;color:#dce6f2;margin-bottom:1.25rem; }
          .ap-grid { display:grid;grid-template-columns:1fr 1fr;gap:0.5rem; }
          .ap-btn { display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--border-color);background:var(--muted);color:#16273a;font-family:'Inter Tight',system-ui,sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:transform .12s,background .15s;text-decoration:none; }
          .ap-btn:hover { background:var(--accent-color);transform:translateY(-2px); }
          .ap-btn img { width:20px;height:20px;border-radius:4px;object-fit:contain; }
          .ap-close { position:absolute;top:12px;right:14px;background:none;border:none;color:#dce6f2;font-size:20px;cursor:pointer;line-height:1; }
          .ap-close:hover { color:#F2F2F2; }
          .ap-raw { margin-top:0.6rem;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;border:1px dashed #F2F2F2;background:transparent;color:#F2F2F2;font-family:'Inter Tight',system-ui,sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s; }
          .ap-raw:hover { background:rgba(255,255,255,.12); }
        </style>
        <div class="ap-modal">
          <button class="ap-close" id="ap-close">&times;</button>
          <div class="ap-title">Select Your Agent</div>
          <div class="ap-sub">Choose your agent once — we'll remember it for next time.</div>
          <div class="ap-grid">
            ${AGENTS.map(a => `<a class="ap-btn" data-agent="${a.id}" href="#"><img src="${esc(a.icon)}" alt="" onerror="this.onerror=null;this.src='${favicon(a.domain)}'">${esc(a.name)}</a>`).join('')}
            <a class="ap-btn" id="ap-raw" href="#" title="Raw Link (Weidian / Taobao / 1688)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>Raw Link
            </a>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      overlay.querySelector('#ap-close').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ap-raw').addEventListener('click', (e) => {
        e.preventDefault();
        const raw = safeExternalUrl(kakobuyRaw || pickslyRaw);
        if (raw !== '#') window.open(raw, '_blank', 'noopener,noreferrer');
        overlay.remove();
      });
      overlay.querySelectorAll('.ap-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.preventDefault();
          const agentId = btn.getAttribute('data-agent');
          localStorage.setItem(PREFERRED_AGENT_KEY, agentId);
          openAgentUrl(resolveBuyUrl(pickslyRaw, kakobuyRaw, agentId));
          overlay.remove();
        });
      });
    }

    // Framing imagine (identic cu Jarvis admin): fragment "#ro=&oy=&z=" în URL.
    // ro = rotire reală (prin proxy wsrv.nl), oy = poziție verticală, z = zoom.
    function cmSplitImg(img) {
      img = String(img || '');
      const h = img.indexOf('#');
      if (h < 0) return { base: img, rot: 0, oy: 50, z: 100 };
      const base = img.slice(0, h), frag = img.slice(h + 1);
      const ro = (frag.match(/ro=(\d+)/) || [])[1];
      const oy = (frag.match(/oy=(\d+)/) || [])[1];
      const z  = (frag.match(/z=(\d+)/) || [])[1];
      return { base, rot: parseInt(ro||'0',10)||0, oy: oy!=null?parseInt(oy,10):50, z: z!=null?parseInt(z,10):100 };
    }
    // wsrv.nl blochează unele domenii (alicdn / Taobao CDN) → alea se încarcă
    // direct, iar rotația se face în CSS (vezi cmThumbStyle).
    const CM_WSRV_BLOCKED = /(^|\.)alicdn\.com/i;
    function cmProxied(base, ro) {
      base = String(base || '').replace(/#.*$/, '');
      if (!base) return '';
      if (CM_WSRV_BLOCKED.test(base)) return base; // wsrv nu servește alicdn
      let url = `https://wsrv.nl/?url=${encodeURIComponent(base)}&w=700&output=webp&q=85&we`;
      if (ro) url += `&ro=${ro % 360}`;
      return url;
    }
    function cmThumbStyle(ci) {
      // Rotație CSS doar când imaginea e încărcată direct (wsrv ocolit) — altfel
      // rotația e deja "coaptă" de proxy.
      const rot = (ci.rot && CM_WSRV_BLOCKED.test(String(ci.base || ''))) ? ` rotate(${ci.rot % 360}deg)` : '';
      if (ci.z < 100) return `width:100%;height:100%;object-fit:contain;object-position:50% ${ci.oy}%;${rot ? `transform:${rot.trim()};` : ''}`;
      let s = `width:100%;height:100%;object-fit:cover;object-position:50% ${ci.oy}%;`;
      const tf = (ci.z !== 100 ? `scale(${ci.z/100})` : '') + rot;
      if (tf.trim()) s += `transform:${tf.trim()};transform-origin:50% ${ci.oy}%;`;
      return s;
    }

    // Badge marketplace: logo Weidian / Taobao / 1688 derivat din linkuri
    // (identic cu Jarvis Finder). Fallback la glifa 店 dacă nu se poate.
    function cmPlatformBadge(p) {
      const s = (p.qc_link || '') + ' ' + (p.buy_link || '');
      const map = { WEIDIAN:'weidian', TAOBAO:'taobao', '1688':'1688', WD:'weidian', TB:'taobao', AL:'1688' };
      let key = '';
      let m = s.match(/\/item\/(WEIDIAN|TAOBAO|1688)\b/i) || s.match(/\/item\/(WD|TB|AL)/i);
      if (m) key = map[m[1].toUpperCase()];
      else if (/weidian\.com/i.test(s)) key = 'weidian';
      else if (/taobao\.com|tmall\.com/i.test(s)) key = 'taobao';
      else if (/1688\.com/i.test(s)) key = '1688';
      if (key) return `<span class="product-store-badge"><img src="/images/${key}.png" alt="${key}" loading="lazy"></span>`;
      return '<span class="product-store-badge">店</span>';
    }

    // Un card de produs. Date reale din DB sau placeholder.
    function buildProductCard(p) {
      const brand = esc(p.brand || '');
      const sellerLabel = esc((p.seller && String(p.seller).trim()) || p.brand || '');
      const title = esc(p.title || 'Untitled');
      const price = esc(formatPrice(p.price));
      const ci = cmSplitImg(p.img);
      const img = ci.base
        ? `<img src="${esc(ci.rot ? cmProxied(ci.base, ci.rot) : ci.base)}" alt="${title}" style="${cmThumbStyle(ci)}" loading="lazy" onload="this.classList.add('loaded');this.parentNode.classList.add('loaded')" onerror="this.parentNode.classList.add('loaded')" />`
        : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:0.7rem;">No img</div>`;
      return `<div class="hc-card product-card">
        <div class="product-image" style="overflow:hidden;position:relative;">${img}
          <button class="card-report-btn" data-report-id="${esc(p.id || '')}" data-report-title="${title}" title="Report item" aria-label="Report item">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
          </button>
        </div>
        <div class="product-info">
          <div class="product-batch-row">${cmPlatformBadge(p)}<span class="product-store-name seller-link" data-seller="${sellerLabel}" role="button" tabindex="0">${sellerLabel}</span></div>
          <h3 class="product-title">${title}</h3>
          <div class="product-price">${price}</div>
          <div class="product-actions">
            <button class="card-btn-buy" data-buy="${esc(p.buy_link || '')}">Buy Now</button>
            <button class="card-btn-qc" data-qc="${esc(p.qc_link || '')}">View QC</button>
          </div>
        </div>
      </div>`;
    }

    // Logo per brand (din colecția "brands" din Firestore). name → img.
    window.brandLogos = window.brandLogos || {};

    // O secțiune (carusel) per brand (sau per seller — vezi opts.btn).
    function buildBrandSection(brand, items, si, opts) {
      opts = opts || {};
      const id = 'st-' + si;
      const cards = items.map(buildProductCard).join('');
      const isNewSec = brand === 'Newly Added Links';
      const logo = window.brandLogos[brand];
      const icon = isNewSec
        ? 'N'
        : (logo ? `<img src="${esc(logo)}" alt="${esc(brand)}" loading="lazy">` : esc(brand.charAt(0).toUpperCase()));
      return `<div class="store-section-card">
        <div class="store-page-header">
          <div class="store-header">
            <div class="store-icon">${icon}</div>
            <div class="store-meta">
              <span class="store-name">${esc(brand)}</span>
              <span class="store-sub">${items.length} product${items.length === 1 ? '' : 's'}</span>
            </div>
          </div>
          <div class="store-head-actions">
            ${isNewSec ? '' : `<button class="store-view-btn store-view-btn-sm">${esc(opts.btn || 'View Brand')}</button>`}
          </div>
        </div>
        <div class="store-section-divider"></div>
        <div class="hc-carousel-wrap">
          <button class="hc-arrow hc-arrow-left" data-carousel="${id}" data-dir="-1">${aL}</button>
          <div class="hc-carousel" id="${id}">${cards}</div>
          <button class="hc-arrow hc-arrow-right" data-carousel="${id}" data-dir="1">${aR}</button>
        </div>
      </div>`;
    }

    // Ordinea categoriilor în fiecare brand: hainele întâi, accessories + restul la final.
    // Folosește câmpul `category` salvat; fallback pe deducere din titlu.
    const CAT_ORDER = { 'Shoes':0,'Slides':1,'Shorts':2,'T-shirts':3,'Pants':4,'Long-sleeve':5,'Hoodies':6,'Jackets':7,'Sets':8,'Blanks':9,'Accessories':10,'Other':11 };
    function cmInferCat(p) {
      const t = ((p.title || '') + ' ' + (p.brand || '')).toLowerCase();
      if (/\bslides?\b|sandal|papuc/.test(t)) return 'Slides';
      if (/\bshoes?\b|sneaker|trainer|jordan|yeezy|dunk|af1|air ?force|air ?max|new ?balance|\bnb\d|boot|loafer|samba|gazelle|campus|forum|\bgel-|salomon|onitsuka/.test(t)) return 'Shoes';
      if (/\bt-?shirts?\b|\btee\b/.test(t)) return 'T-shirts';
      if (/long ?sleeve/.test(t)) return 'Long-sleeve';
      if (/\bshorts?\b/.test(t)) return 'Shorts';
      if (/\bpants?\b|trouser|jean|denim|cargo|sweatpants?\b|jogger|\bsweats\b/.test(t)) return 'Pants';
      if (/\bhoodie|hooded|sweatshirt|crewneck|crew ?neck|zip ?up/.test(t)) return 'Hoodies';
      if (/\bjacket|coat|parka|puffer|windbreaker|bomber|\bdown\b|vest/.test(t)) return 'Jackets';
      if (/\bhat|cap\b|beanie|belt|sock|scarf|glove|sunglass|glasses|necklace|bracelet|\bring\b|\bbag\b|backpack|wallet/.test(t)) return 'Accessories';
      return 'Other';
    }
    function cmCatOf(p) {
      return (p.category && CAT_ORDER[p.category] != null) ? p.category : cmInferCat(p);
    }
    function cmCatRank(p) {
      return CAT_ORDER[cmCatOf(p)] != null ? CAT_ORDER[cmCatOf(p)] : 9;
    }
    // Filtrul de categorie din header (buton dropdown lângă "Products").
    window.cmCat = 'all';
    function cmCatFilterList(products) {
      return (window.cmCat && window.cmCat !== 'all') ? products.filter(p => cmCatOf(p) === window.cmCat) : products;
    }
    // Filtrul de search (pe DATE, nu ascunde carduri) — ca să nu ținem tot în DOM.
    window.cmQuery = '';
    function cmSearchFilterList(products) {
      const q = (window.cmQuery || '').toLowerCase().trim();
      if (!q) return products;
      return products.filter(p =>
        String(p.title || '').toLowerCase().includes(q) ||
        String(p.seller || '').toLowerCase().includes(q) ||
        String(p.brand || '').toLowerCase().includes(q));
    }
    function cmVisibleList(products) { return cmSearchFilterList(cmCatFilterList(products)); }

    // Randare progresivă a secțiunilor (câteva odată, restul pe scroll) — altfel
    // ~2800 produse deodată = zeci de mii de noduri și crash de memorie pe iPhone.
    let _sectionIO = null;
    function paintSections(entries, opts) {
      opts = opts || {};
      const host = document.getElementById('stores');
      if (_sectionIO) { _sectionIO.disconnect(); _sectionIO = null; }
      host.innerHTML = '';
      if (!entries.length) { host.innerHTML = `<p style="text-align:center;opacity:.7;padding:3rem;">${opts.empty || 'Niciun produs.'}</p>`; return; }
      const BATCH = 6;
      let i = 0;
      const sentinel = document.createElement('div');
      sentinel.style.cssText = 'height:1px;grid-column:1/-1;';
      host.appendChild(sentinel);
      function renderBatch() {
        const slice = entries.slice(i, i + BATCH);
        const html = slice.map(([name, items], k) => buildBrandSection(name, items, i + k, opts.section)).join('');
        sentinel.insertAdjacentHTML('beforebegin', html);
        i += slice.length;
        wireCarousels();
        if (i >= entries.length) { if (_sectionIO) { _sectionIO.disconnect(); _sectionIO = null; } sentinel.remove(); }
      }
      renderBatch();
      if (i < entries.length) {
        _sectionIO = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) renderBatch(); }, { rootMargin: '1000px' });
        _sectionIO.observe(sentinel);
      }

    // Prețurile de pe Discord (importurile din 2 iul) sunt în USD, dar site-ul
    // stochează CNY. Corectez la încărcare, mărginit strict la fereastra 2 iul,
    // ca să nu ating produsele adăugate ulterior (care sunt deja în CNY).
    const USD_FIX_FROM = Date.parse('2026-07-02T00:00:00Z');
    const USD_FIX_TO   = Date.parse('2026-07-03T00:00:00Z');
    function cmFixUsdPrices(products) {
      for (const p of products) {
        if (!p || p._usdFixed) continue;
        const ms = cmCreatedMs(p);
        const n = Number(p.price);
        if (ms >= USD_FIX_FROM && ms < USD_FIX_TO && p.price != null && !isNaN(n) && n > 0) {
          p.price = Math.round(n / 0.14); // USD -> CNY (site: 1 CNY = 0.14 USD)
          p._usdFixed = true;
        }
      }
    }

    // Salvează produsele și randează ruta curentă (toate brandurile sau un seller).
    function render(products) {
      cmFixUsdPrices(products);
      window.cmProducts = products;
      cmRoute();
    }

    // Secțiunea "Newly Added Links": produsele adăugate recent, fixate SUS.
    const NEW_SECTION = 'Newly Added Links';
    const NEW_SINCE = Date.parse('2026-07-02T00:00:00Z'); // tot ce e adăugat de la această dată
    function cmCreatedMs(p) {
      const c = p && p.created_at;
      if (!c) return 0;
      if (typeof c === 'string') return Date.parse(c) || 0;
      if (typeof c.toMillis === 'function') return c.toMillis();
      if (typeof c.seconds === 'number') return c.seconds * 1000;
      return 0;
    }
    const cmIsNew = p => cmCreatedMs(p) >= NEW_SINCE;

    // Vederea normală: produsele grupate pe brand.
    function renderAllBrands() {
      const products = cmVisibleList(window.cmProducts || []);
      const map = new Map();
      products.forEach(p => {
        const b = (p.brand || 'Other').trim() || 'Other';
        if (!map.has(b)) map.set(b, []);
        map.get(b).push(p);
      });
      // Sortează produsele din fiecare brand pe categorie (stabil în interiorul categoriei).
      for (const items of map.values()) items.sort((a, b) => cmCatRank(a) - cmCatRank(b));
      // Ordine: "Unbranded"/"Other" mereu ultimele, apoi brandurile care încep cu cifră, restul în ordine.
      const rank = (b) => (b === 'Unbranded' || b === 'Other') ? 2 : (/^\d/.test(b) ? 1 : 0);
      const entries = [...map.entries()].sort((a, b) => rank(a[0]) - rank(b[0]));
      // Fixează secțiunea "Newly Added Links" în vârf (doar pe vederea completă, fără filtre).
      if (window.cmCat === 'all' && !(window.cmQuery || '').trim()) {
        const fresh = products.filter(cmIsNew).sort((a, b) => cmCreatedMs(b) - cmCreatedMs(a));
        if (fresh.length) entries.unshift([NEW_SECTION, fresh]);
      }
      document.querySelector('.stores-page-head h1').textContent = 'Products';
      paintSections(entries, { empty: 'Niciun produs încă.' });

      const products = cmVisibleList(window.cmProducts || []);
      const map = new Map();
      products.forEach(p => {
        const s = (String(p.seller || '').trim() || p.brand || 'Other').trim() || 'Other';
        if (!map.has(s)) map.set(s, []);
        map.get(s).push(p);
      });
      for (const items of map.values()) items.sort((a, b) => cmCatRank(a) - cmCatRank(b));
      const rank = (s) => s === 'Other' ? 2 : (/^\d/.test(s) ? 1 : 0);
      const entries = [...map.entries()].sort((a, b) =>

    // Citește numele sellerului din URL: /seller/<nume> (fallback #seller=<nume>).

      const m = location.pathname.match(/\/seller\/([^/?#]+)/);

    // ── Report Item ──
    (function reportFeature() {
      const REASONS = [
        { key: 'out_of_stock',  label: 'Out of stock' },

      async function getDb() {
        if (_db) return _db;
        const cfg = (window.COLDMODE || {}).firebaseConfig;
        if (!cfg || !cfg.projectId) throw new Error('firebase not configured');
        const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
        _db = getFirestore(getApps().length ? getApps()[0] : initializeApp(cfg));
        return _db;
      }
      function refreshSubmit() {

      function renderOptions() {
        body.innerHTML = REASONS.map(r =>
          `<button class="rp-opt" data-reason="${r.key}"><span class="rp-radio"></span><span class="rp-opt-label">${r.label}</span></button>`
        ).join('');
        body.querySelectorAll('.rp-opt').forEach(b => b.addEventListener('click', () => {
          selected = b.dataset.reason;
          body.querySelectorAll('.rp-opt').forEach(x => x.classList.toggle('sel', x === b));
          note.hidden = selected !== 'other';
          refreshSubmit();
        }));
      }
      function open(id, title) {
        ctx = { id, title };
        selected = null; noteInput.value = ''; note.hidden = true;
        submitBtn.disabled = true; submitBtn.textContent = 'Submit Report';
        renderOptions();
        overlay.classList.add('open');
      }
      function close() { overlay.classList.remove('open'); ctx = null; }

      document.addEventListener('click', e => {

    function wireCarousels() {
      // Rotița mouse-ului + săgeți + drag. Totul prin același sistem de animație
      // pe carusel (o singură sursă de adevăr pentru poziția de scroll).
      document.querySelectorAll('.hc-carousel').forEach(el => {
        if (el._scrollBound) return;
        el._scrollBound = true;

        // Rotița din mijloc: derulează caruselul pe orizontală, animat (smooth + rapid).
        let target = el.scrollLeft, animating = false;
        const SPEED = 1.6; // cât de rapid urmărește rotița
        const EASE = 0.22;  // 0..1 — mai mare = mai snappy
        function animate() {
          const diff = target - el.scrollLeft;
          if (Math.abs(diff) < 0.5) { el.scrollLeft = target; animating = false; el.style.scrollBehavior = 'smooth'; return; }
          el.scrollLeft += diff * EASE;
          requestAnimationFrame(animate);
        }
        function scrollByAmount(amount) {
          if (el.scrollWidth <= el.clientWidth) return;
          const max = el.scrollWidth - el.clientWidth;
          if (!animating) target = el.scrollLeft; // resync dacă a fost oprit
          target = Math.max(0, Math.min(max, target + amount));
          if (!animating) { animating = true; el.style.scrollBehavior = 'auto'; requestAnimationFrame(animate); }
        }
        // Săgețile (frați ai caruselului) folosesc același animate — legate o
        // singură dată (altfel randarea progresivă dubla listenerii).
        const wrap = el.closest('.hc-carousel-wrap');
        if (wrap) wrap.querySelectorAll('.hc-arrow').forEach(btn => {
          btn.addEventListener('click', () => scrollByAmount(259 * Number(btn.dataset.dir)));
        });
        el.addEventListener('wheel', e => {
          if (el.scrollWidth <= el.clientWidth) return;
          // Preia DOAR rotița de mouse clasic (pași mari/discreți, fără deltaX)
          // sau Shift+rotiță. Touchpad-ul (deltaX, sau deltaY mici) e ignorat —
          // caruselul se derulează doar cu rotița sau cu săgețile.
          const mouseWheel = e.deltaX === 0 && (e.deltaMode === 1 || Math.abs(e.deltaY) >= 50);
          if (!(mouseWheel || e.shiftKey)) return;
          const delta = e.deltaX !== 0 ? e.deltaX : e.deltaY;
          if (!delta) return;
          e.preventDefault();
          scrollByAmount(delta * SPEED);
        }, { passive: false });

        // Drag cu butonul stâng: tragi caruselul cu mouse-ul (mousemove/up sunt globale).
        el.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          cmDrag.el = el; cmDrag.startX = e.pageX; cmDrag.scrollL = el.scrollLeft; cmDrag.moved = false;
          el.style.scrollBehavior = 'auto';
        });
        // După un drag, anulează click-ul accidental pe card/seller/buton.
        el.addEventListener('click', e => {
          if (el._justDragged) { e.preventDefault(); e.stopPropagation(); el._justDragged = false; }
        }, true);
      });

    window.addEventListener('mouseup', () => {

    // URL de search ca pe Jarvis: /product/search?<termen>. Pe file:// pushState

    function updateSearchUrl(q) {
      q = (q || '').trim();
      try {
        const url = q ? '/product/search?' + encodeURIComponent(q) : '/';
        if (location.pathname + location.search !== url) history.pushState({ q }, '', url);
      } catch (_) {
        location.hash = q ? 'search=' + encodeURIComponent(q) : '';

    // Citește termenul din URL (cale clean, query simplu, ?search=, sau #search=).
    function readSearchUrl() {
      if (/\/product\/search/.test(location.pathname) && location.search) {
        const s = location.search.slice(1);
        return decodeURIComponent(/^search=/.test(s) ? s.replace(/^search=/, '') : s);

    // ── Search focus panel (Recent / Trending / Recently viewed) ──
    (function searchPanel() {
      const input = document.getElementById('search');
      const panel = document.getElementById('search-panel');
      const host = input.closest('.search-host');
      const clockSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
      const boltSvg = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>';

      const getRecent = () => { try { return JSON.parse(localStorage.getItem('cm_recent') || '[]'); } catch { return []; } };
      const setRecent = a => localStorage.setItem('cm_recent', JSON.stringify(a.slice(0, 8)));
      window.cmPushRecent = (q) => { q = (q || '').trim(); if (!q) return; const a = getRecent().filter(x => x.toLowerCase() !== q.toLowerCase()); a.unshift(q); setRecent(a); };
      const getViewed = () => { try { return JSON.parse(localStorage.getItem('cm_viewed') || '[]'); } catch { return []; } };
      window.cmPushViewed = (p) => { if (!p || !p.title) return; const a = getViewed().filter(x => x.title !== p.title); a.unshift({ title: p.title, img: p.img || '', purl: p.purl || '' }); localStorage.setItem('cm_viewed', JSON.stringify(a.slice(0, 12))); };

      // Contor căutări (localStorage) → top căutate. Cheia e numele brandului.
      const getCounts = () => { try { return JSON.parse(localStorage.getItem('cm_search_counts') || '{}'); } catch { return {}; } };
      const bumpCount = (q) => {
        q = (q || '').trim(); if (!q) return;
        // normalizează la numele de brand exact dacă există, ca să nu fragmenteze
        const brands = [...new Set((window.cmProducts || []).map(p => (p.brand || '').trim()).filter(Boolean))];
        const hit = brands.find(b => b.toLowerCase() === q.toLowerCase());
        const key = hit || q;
        const c = getCounts(); c[key] = (c[key] || 0) + 1;
        localStorage.setItem('cm_search_counts', JSON.stringify(c));
      };

      // Trending = top 10 cele mai căutate branduri; dacă n-avem destule căutări,
      // completăm cu cele mai mari branduri (după număr de produse).
      function trending() {
        const counts = getCounts();
        const searched = Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k]) => k);
        const prodCount = {};
        (window.cmProducts || []).forEach(p => { const b = (p.brand || '').trim(); if (b) prodCount[b] = (prodCount[b] || 0) + 1; });
        const SKIP = new Set(['Other', 'Unbranded', 'Merch', 'Blanks']);
        const bySize = Object.entries(prodCount).filter(([b]) => !SKIP.has(b)).sort((a, b) => b[1] - a[1]).map(([k]) => k);
        const out = [], seen = new Set();
        for (const b of [...searched, ...bySize]) { const k = b.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(b); } if (out.length === 10) break; }
        return out;
      }

      function applyQuery(q) {
        input.value = q;
        input.dispatchEvent(new Event('input'));
        window.cmPushRecent(q);

        }
        if (trend.length) {
          html += `<div class="sp-section"><div class="sp-head">Trending</div>
            <div class="sp-chips">${trend.map(q => `<button class="sp-chip" data-q="${esc(q)}">${boltSvg}${esc(q)}</button>`).join('')}</div></div>`;
        }
        if (viewed.length) {
          html += `<div class="sp-section"><div class="sp-head">Recently viewed</div>
            <div class="sp-thumbs">${viewed.map(v => `<div class="sp-thumb" data-q="${esc(v.title)}" title="${esc(v.title)}">${v.img ? `<img src="${esc(v.img)}" alt="">` : ''}</div>`).join('')}</div></div>`;
        }
        if (!html) html = '<div class="sp-empty">Type to search brands or products…</div>';
        panel.innerHTML = html;
        const clr = panel.querySelector('#sp-clear');
        if (clr) clr.onclick = (e) => { e.stopPropagation(); localStorage.removeItem('cm_recent'); build(); };
        panel.querySelectorAll('.sp-chip').forEach(c => c.onclick = () => applyQuery(c.dataset.q));
        // Recently viewed: click → caută produsul (coldmode n-are pagină de produs).
        panel.querySelectorAll('.sp-thumb').forEach(t => t.onclick = () => { if (t.dataset.q) applyQuery(t.dataset.q); });
      }
      function show() { build(); panel.hidden = false; }
      function hide() { panel.hidden = true; }

      input.addEventListener('focus', show);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { window.cmPushRecent(input.value); bumpCount(input.value); hide(); } if (e.key === 'Escape') hide(); });
      document.addEventListener('click', e => { if (!host.contains(e.target)) hide(); });
    })();

  <script type="module">
    const cfg = window.COLDMODE || {};
    const fb = cfg.firebaseConfig || {};
    if (fb.projectId) {
      // ── Cache client-side (localStorage) ca să NU mai citim din Firestore la
      // fiecare vizită/refresh. Cu ~2800 produse, un fetch = ~2800 reads; planul
      // gratuit are 50k/zi. Cât timp cache-ul e proaspăt (TTL), zero reads. ──
      const CACHE_KEY = 'cm_products_cache_v1';
      const TTL = 60 * 60 * 1000; // 60 min

      const forceFresh = /(?:\?|&)fresh\b/.test(location.search);
      let served = false;
      try {
        const raw = forceFresh ? null : localStorage.getItem(CACHE_KEY);
        if (raw) {
          const c = JSON.parse(raw);
          if (c && Array.isArray(c.items) && (Date.now() - c.t) < TTL) {
            window.brandLogos = c.brandLogos || {};
            window.cmRender(c.items);
            window.cmContentReady && window.cmContentReady();
            served = true;
          }
        }
      } catch (_) {}

      if (!served) {
        try {
          const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
          const { getFirestore, collection, getDocs } =
            await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
          const db = getFirestore(initializeApp(fb));
          window.brandLogos = window.brandLogos || {};
          // Logo-uri de brand (colecția "brands") → window.brandLogos[name] = img
          try {
            const bsnap = await getDocs(collection(db, 'brands'));
            bsnap.docs.forEach(d => { const b = d.data(); if (b && b.name && b.img) window.brandLogos[b.name] = b.img; });
          } catch (_) {}
          // Fără orderBy('brand'): Firestore exclude documentele care n-au câmpul `brand`,
          // deci produsele unbranded dispăreau complet. Iau tot și sortez pe client.
          const snap = await getDocs(collection(db, cfg.COLLECTION || 'products'));
          const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          items.sort((a, b) => String(a.brand || '').localeCompare(String(b.brand || '')));
          window.cmRender(items);
          // Salvez în cache pentru vizitele/refresh-urile următoare.
          try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items, brandLogos: window.brandLogos })); } catch (_) {}
        } catch (e) {
          console.error('Firestore fetch failed:', e);
        } finally {
          window.cmContentReady && window.cmContentReady(); // arăt pagina după ce conținutul e gata
        }
      }
    } else {
      window.cmContentReady && window.cmContentReady();
    }
  </script>
</body>
