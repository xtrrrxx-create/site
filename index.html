    <script src="js/app.js"></script>
    <script>
    (function () {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let W, H, shapes = [];
        let mouseX = -9999, mouseY = -9999;

        const SHAPE_COUNT = 28;
        const REPEL_RADIUS = 140;
        const REPEL_STRENGTH = 5;
        const RETURN_SPEED = 0.06;
        const TYPES = ['triangle', 'diamond', 'line', 'square'];

        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseleave', () => { mouseX = -9999; mouseY = -9999; });

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function randBetween(a, b) { return a + Math.random() * (b - a); }

        function spawnShape(fromScratch) {
            const angle = randBetween(25, 55) * Math.PI / 180;
            const speed = randBetween(1.2, 3.5);
            const size = randBetween(4, 14);
            const type = TYPES[Math.floor(Math.random() * TYPES.length)];
            const tailLen = randBetween(40, 130);
            const alpha = randBetween(0.4, 1);
            const bvx = -Math.cos(angle) * speed;
            const bvy = Math.sin(angle) * speed;

            let x, y;
            if (fromScratch) {
                x = randBetween(0, W);
                y = randBetween(0, H);
            } else {
                if (Math.random() < 0.5) { x = randBetween(0, W); y = -20; }
                else { x = W + 20; y = randBetween(0, H); }
            }

            // bvx/bvy = base trajectory, rvx/rvy = repulsion offset (decays back to 0)
            return { x, y, bvx, bvy, rvx: 0, rvy: 0, size, type, tailLen, alpha, trail: [] };
        }

        function init() {
            shapes = [];
            for (let i = 0; i < SHAPE_COUNT; i++) shapes.push(spawnShape(true));
        }

        function drawTriangle(x, y, size, alpha, color) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size * 0.866, y + size * 0.5);
            ctx.lineTo(x - size * 0.866, y + size * 0.5);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawDiamond(x, y, size, alpha, color) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x + size * 0.6, y);
            ctx.lineTo(x, y + size);
            ctx.lineTo(x - size * 0.6, y);
            ctx.closePath();
            ctx.stroke();
            ctx.restore();
        }

        function drawSquare(x, y, size, alpha, color) {
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.translate(x, y);
            ctx.rotate(Math.PI / 4);
            ctx.strokeRect(-size / 2, -size / 2, size, size);
            ctx.restore();
        }

        function drawShape(s, color) {
            if (s.type === 'triangle') drawTriangle(s.x, s.y, s.size, s.alpha, color);
            else if (s.type === 'diamond') drawDiamond(s.x, s.y, s.size, s.alpha, color);
            else if (s.type === 'square') drawSquare(s.x, s.y, s.size, s.alpha, color);
        }

        function drawTail(s, color) {
            if (s.trail.length < 2) return;
            ctx.save();
            for (let i = 1; i < s.trail.length; i++) {
                const t = i / s.trail.length;
                ctx.globalAlpha = s.alpha * t * 0.4;
                ctx.strokeStyle = color;
                ctx.lineWidth = s.size * t * 0.5;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(s.trail[i - 1].x, s.trail[i - 1].y);
                ctx.lineTo(s.trail[i].x, s.trail[i].y);
                ctx.stroke();
            }
            ctx.restore();
        }

        function getColor() {
            return document.body.classList.contains('light-mode') ? '#000' : '#fff';
        }

        function loop() {
            ctx.clearRect(0, 0, W, H);
            const color = getColor();

            for (let i = 0; i < shapes.length; i++) {
                const s = shapes[i];

                // mouse repulsion
                const dx = s.x - mouseX;
                const dy = s.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < REPEL_RADIUS && dist > 0) {
                    const force = (1 - dist / REPEL_RADIUS) * REPEL_STRENGTH;
                    s.rvx += (dx / dist) * force;
                    s.rvy += (dy / dist) * force;
                }
                // decay repulsion offset back toward 0
                s.rvx += (0 - s.rvx) * RETURN_SPEED;
                s.rvy += (0 - s.rvy) * RETURN_SPEED;

                const vx = s.bvx + s.rvx;
                const vy = s.bvy + s.rvy;

                s.trail.push({ x: s.x, y: s.y });
                const maxTrail = Math.floor(s.tailLen / Math.hypot(vx, vy));
                if (s.trail.length > maxTrail) s.trail.shift();

                drawTail(s, color);
                if (s.type !== 'line') drawShape(s, color);

                s.x += vx;
                s.y += vy;

                if (s.x < -100 || s.y > H + 100 || s.x > W + 100) {
                    shapes[i] = spawnShape(false);
                }
            }

            requestAnimationFrame(loop);
        }

        resize();
        init();
        loop();
        window.addEventListener('resize', () => { resize(); init(); });
    })();
    </script>
</body>
